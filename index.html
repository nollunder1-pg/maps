<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Map</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script>
function initMap() {

  const map = new google.maps.Map(document.getElementById("map"), {
    center: {
      lat: 60.1699,
      lng: 24.9384
    },

    zoom: 10,

    clickableIcons: false
  });

}
</script>

<script
  src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"
  async
  defer>
</script>

</body>
</html>
