<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Maps</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #topbar {
      height: 60px;
      background: #111;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
    }

    .tab-btn {
      background: #222;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
    }

    .tab-btn:hover {
      background: #333;
    }

    #googleMap,
    #yandexMap {
      width: 100%;
      height: calc(100vh - 60px);
      display: none;
    }

    #googleMap.active,
    #yandexMap.active {
      display: block;
    }
  </style>
</head>

<body>

<div id="topbar">
  <button class="tab-btn" onclick="showMap('google')">
    Google Maps
  </button>

  <button class="tab-btn" onclick="showMap('yandex')">
    Yandex Maps
  </button>
</div>

<div id="googleMap" class="active"></div>
<div id="yandexMap"></div>

<script>
function showMap(type) {

  document.getElementById("googleMap").classList.remove("active");
  document.getElementById("yandexMap").classList.remove("active");

  if (type === "google") {
    document.getElementById("googleMap").classList.add("active");
  }

  if (type === "yandex") {
    document.getElementById("yandexMap").classList.add("active");
  }
}

function initGoogleMap() {

  new google.maps.Map(document.getElementById("googleMap"), {

    center: {
      lat: 55.7558,
      lng: 37.6176
    },

    zoom: 10,

    clickableIcons: false
  });
}

ymaps.ready(function () {

  new ymaps.Map("yandexMap", {

    center: [55.7558, 37.6176],

    zoom: 10

  });
});
</script>

<!-- GOOGLE MAPS -->
<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAAxhNnBCeAfKpWJJiFlD8vBSY8R3AcffE&callback=initMap"
  async
  defer>
</script>

<!-- YANDEX MAPS -->
<script src="https://api-maps.yandex.ru/2.1/?apikey=42a5fca7-f7b1-4a21-9885-f4ab2d266b38&lang=ru_RU"></script>

</body>
</html>
